# ====================================================================
# AURELIA RESORT & NATURE RETREAT — APPLICATION CONFIGURATION
# ====================================================================

spring.application.name=aurelia-resort-backend
server.port=${PORT:8080}

# Database Configuration (Supabase PostgreSQL or fallback H2 for quick offline testing)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://db.YOUR_SUPABASE_PROJECT_REF.supabase.co:5432/postgres}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:YOUR_SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-milliseconds=86400000

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://aureliaresort.netlify.app}

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.aurelia.resort=INFO
